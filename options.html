<!DOCTYPE html>
<html>
<head>
    <title>dxheat2flrig Options</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            color: #333;
            margin: 0;
            padding: 16px;
            min-width: 420px;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
        }
        .section {
            margin-bottom: 16px;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }
        .section-title {
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 10px;
        }
        .field {
            margin-bottom: 10px;
        }
        .field:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 3px;
        }
        input[type="text"] {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #33aa33;
            box-shadow: 0 0 0 2px rgba(51, 170, 51, 0.2);
        }
        .help {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row .field {
            flex: 1;
        }
        .btn {
            background: #33aa33;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 8px;
        }
        .btn:hover {
            background: #2a8f2a;
        }
        .btn-secondary {
            background: #555;
        }
        .btn-secondary:hover {
            background: #444;
        }
        .alert {
            display: none;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .alert.show {
            display: block;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
        }
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .actions {
            margin-top: 14px;
        }
    </style>
</head>
<body>
    <h2>dxheat2flrig Options</h2>
    <div class="alert alert-success" id="status">Options saved.</div>
    <div class="alert" id="test-status"></div>

    <div class="section">
        <div class="section-title">Connection</div>
        <div class="field">
            <label for="flrig-uri">FLRig URI</label>
            <input type="text" class="option" id="flrig-uri">
            <div class="help">Default: http://127.0.0.1:12345/ -- the XML-RPC address of your FLRig instance</div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">CW</div>
        <div class="row">
            <div class="field">
                <label for="cw-mode">Mode</label>
                <input type="text" class="option" id="cw-mode">
                <div class="help">e.g. CW-L, CW-U, CW</div>
            </div>
            <div class="field">
                <label for="cw-bw">Bandwidth (Hz)</label>
                <input type="text" class="option" id="cw-bw">
                <div class="help">e.g. 500, 250, 0=skip</div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">SSB / Phone</div>
        <div class="row">
            <div class="field">
                <label for="ssb-mode">Mode</label>
                <input type="text" class="option" id="ssb-mode">
                <div class="help">e.g. USB, LSB</div>
            </div>
            <div class="field">
                <label for="ssb-bw">Bandwidth (Hz)</label>
                <input type="text" class="option" id="ssb-bw">
                <div class="help">e.g. 2400, 2800, 0=skip</div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Digital</div>
        <div class="row">
            <div class="field">
                <label for="digi-mode">Mode</label>
                <input type="text" class="option" id="digi-mode">
                <div class="help">e.g. DATA-U, RTTY, USB-D</div>
            </div>
            <div class="field">
                <label for="digi-bw">Bandwidth (Hz)</label>
                <input type="text" class="option" id="digi-bw">
                <div class="help">e.g. 3000, 2800, 0=skip</div>
            </div>
        </div>
    </div>

    <div class="actions">
        <button type="button" id="save-btn" class="btn">Save</button>
        <button type="button" id="test-btn" class="btn btn-secondary">Test Connection</button>
    </div>

    <script src="options.js"></script>
</body>
</html>
