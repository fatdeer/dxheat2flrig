<!DOCTYPE html>
<html>
<head>
    <title>dxheat2flrig Options</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            color: #333;
            margin: 0;
            padding: 16px;
            min-width: 400px;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
        }
        .field {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
        }
        input[type="text"] {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #33aa33;
            box-shadow: 0 0 0 2px rgba(51, 170, 51, 0.2);
        }
        .help {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }
        .btn {
            background: #33aa33;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn:hover {
            background: #2a8f2a;
        }
        .alert {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .alert.show {
            display: block;
        }
    </style>
</head>
<body>
    <h2>dxheat2flrig Options</h2>
    <div class="alert" id="status">Options saved.</div>

    <div class="field">
        <label for="flrig-uri">FLRig URI</label>
        <input type="text" class="option" id="flrig-uri">
        <div class="help">Default: http://127.0.0.1:12345/ (must match your FLRig XML-RPC address)</div>
    </div>
    <div class="field">
        <label for="cw-mode">CW Mode</label>
        <input type="text" class="option" id="cw-mode">
        <div class="help">Mode sent to FLRig for CW spots (e.g. CW-L, CW-U, CW)</div>
    </div>
    <div class="field">
        <label for="ssb-mode">SSB Mode</label>
        <input type="text" class="option" id="ssb-mode">
        <div class="help">Mode sent to FLRig for SSB/Phone spots (e.g. USB, LSB)</div>
    </div>
    <div class="field">
        <label for="digi-mode">Digital Mode</label>
        <input type="text" class="option" id="digi-mode">
        <div class="help">Mode sent to FLRig for digital spots (e.g. DATA-U, RTTY, USB-D)</div>
    </div>

    <button type="button" id="save-btn" class="btn">Save</button>
    <script src="options.js"></script>
</body>
</html>
