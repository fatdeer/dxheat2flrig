<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            color: #333;
            margin: 0;
            padding: 12px;
            min-width: 220px;
        }
        h3 {
            margin: 0 0 10px 0;
            font-size: 15px;
            color: #222;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #eee;
        }
        .status-row:last-of-type {
            border-bottom: none;
        }
        .label {
            font-weight: 600;
            color: #555;
        }
        .value {
            color: #111;
            font-family: monospace;
        }
        .connected { color: #33aa33; font-weight: 600; }
        .disconnected { color: #cc3333; font-weight: 600; }
        .footer {
            margin-top: 10px;
            text-align: center;
        }
        .footer a {
            font-size: 12px;
            color: #33aa33;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        #loading {
            color: #888;
            text-align: center;
            padding: 16px 0;
        }
    </style>
</head>
<body>
    <h3>dxheat2flrig</h3>
    <div id="loading">Connecting...</div>
    <div id="info" style="display:none;">
        <div class="status-row">
            <span class="label">Status</span>
            <span class="value" id="conn-status"></span>
        </div>
        <div class="status-row">
            <span class="label">FLRig</span>
            <span class="value" id="version"></span>
        </div>
        <div class="status-row">
            <span class="label">Frequency</span>
            <span class="value" id="frequency"></span>
        </div>
        <div class="status-row">
            <span class="label">Mode</span>
            <span class="value" id="mode"></span>
        </div>
    </div>
    <div class="footer">
        <a href="#" id="options-link">Options</a>
    </div>
    <script src="popup.js"></script>
</body>
</html>
