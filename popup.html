<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            font-size: 13px;
            color: #333;
            padding: 14px 16px;
            min-width: 240px;
            background: #fafafa;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #33aa33;
        }
        .header h3 {
            font-size: 15px;
            font-weight: 700;
            color: #222;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .status-row:last-of-type {
            border-bottom: none;
        }
        .label {
            font-weight: 600;
            color: #555;
            font-size: 12px;
        }
        .value {
            color: #111;
            font-family: "JetBrains Mono", "Fira Code", monospace;
            font-size: 13px;
        }
        .connected { color: #33aa33; font-weight: 700; }
        .disconnected { color: #cc3333; font-weight: 700; }
        .footer {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid #eee;
            text-align: center;
        }
        .footer a {
            font-size: 12px;
            color: #33aa33;
            text-decoration: none;
            font-weight: 500;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        #loading {
            color: #888;
            text-align: center;
            padding: 20px 0;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>DXHeat 一键调频</h3>
    </div>
    <div id="loading">正在连接 FLRig...</div>
    <div id="info" style="display:none;">
        <div class="status-row">
            <span class="label">连接状态</span>
            <span class="value" id="conn-status"></span>
        </div>
        <div class="status-row">
            <span class="label">FLRig 版本</span>
            <span class="value" id="version"></span>
        </div>
        <div class="status-row">
            <span class="label">当前频率</span>
            <span class="value" id="frequency"></span>
        </div>
        <div class="status-row">
            <span class="label">当前模式</span>
            <span class="value" id="mode"></span>
        </div>
    </div>
    <div class="footer">
        <a href="#" id="options-link">打开设置</a>
    </div>
    <script src="popup.js"></script>
</body>
</html>
